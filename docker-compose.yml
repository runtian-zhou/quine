services:
  quine:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    stdin_open: true
    tty: true
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      XDG_RUNTIME_DIR: /tmp/xdg-runtime
      XDG_STATE_HOME: /root/.quine
      GIT_CONFIG_GLOBAL: /root/.config/git/config
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen-3.5}
      LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      PERMISSION_LLM_ENABLED: ${PERMISSION_LLM_ENABLED:-false}
    volumes:
      - /Users/runtianz/quine:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - quine-target:/workspace/target
      - quine-home:/root/.quine
      - gh-config:/root/.config/gh
      - git-config:/root/.config/git
volumes:
  cargo-registry:
  cargo-git:
  quine-target:
  quine-home:
  gh-config:
  git-config:
