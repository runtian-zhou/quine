name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v0.1.0"
        required: true
      ref:
        description: "Git ref to release from"
        required: false
        default: "main"
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: quine-x86_64-linux
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: quine-x86_64-macos
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: quine-aarch64-macos

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.90.0"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin quine

      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.artifact }}-${{ env.RELEASE_TAG }}.tar.gz quine
          cd ../../..

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}-${{ env.RELEASE_TAG }}.tar.gz

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: quine-*
          merge-multiple: true

      - name: Generate release metadata
        run: scripts/generate-release-metadata.sh artifacts release-assets

      - name: Show release assets
        run: ls -lh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_REF }}
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
            release-assets/quine.rb

  update_tap_formula:
    name: Update Tap Formula
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.prerelease) }}
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: quine-*
          merge-multiple: true

      - name: Generate release metadata
        run: scripts/generate-release-metadata.sh artifacts release-assets

      - name: Update tap formula
        run: |
          mkdir -p Formula
          cp release-assets/quine.rb Formula/quine.rb

      - name: Commit tap formula update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/quine.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git commit -m "Update Homebrew formula for ${RELEASE_TAG}"
          git push origin HEAD:${{ github.event.repository.default_branch }}
