[package]
name = "quine-harness"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "quine-harness"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
quine-core = { path = "../quine-core" }
quine-llm = { path = "../quine-llm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "net", "io-util", "signal", "fs", "time", "test-util"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
