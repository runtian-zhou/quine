[package]
name = "quine-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
libc = "0.2"
quine-llm = { path = "../quine-llm" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "process", "time", "fs", "io-util", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
