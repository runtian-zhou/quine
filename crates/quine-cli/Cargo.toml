[package]
name = "quine-cli"
version = "0.2.9"
edition = "2021"
license = "MIT OR Apache-2.0"
build = "build.rs"

[[bin]]
name = "quine"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
quine-harness = { path = "../quine-harness" }
quine-llm = { path = "../quine-llm" }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "net", "io-util", "io-std", "signal", "fs", "process", "time"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
unicode-width = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = "3.6.1"

[dev-dependencies]
tempfile = "3"
