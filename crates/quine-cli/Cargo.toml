[package]
name = "quine-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "quine"
path = "src/main.rs"

[dependencies]
quine-core = { path = "../quine-core" }
quine-llm = { path = "../quine-llm" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
chrono = "0.4"
crossterm = "0.28"
syntect = "5"
termimad = "0.30"
anyhow = "1"
futures = "0.3"
