[package]
name = "quine-llm"
version = "0.1.0"
edition = "2021"

[dependencies]
quine-core = { path = "../quine-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
futures = "0.3"
