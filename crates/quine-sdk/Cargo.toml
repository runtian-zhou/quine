[package]
name = "quine-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "sync", "time"] }
quine-harness = { path = "../quine-harness" }

[dev-dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
quine-core = { path = "../quine-core" }
quine-llm = { path = "../quine-llm" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
uuid = { version = "1", features = ["v4"] }
