[package]
name = "quine-cli"
version = "0.1.0"
edition = "2021"
description = "A CLI tool with structured JSON output support"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
